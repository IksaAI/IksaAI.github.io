<article class="tile feature" aria-labelledby="feature-title">
  <div class="feature-copy">
    <p class="label">No. {{no}}{{sep}}{{featuredLabel}}</p>
    <img class="icon" src="{{root}}{{icon}}" width="68" height="68" alt="">
    <h3 id="feature-title">{{name}}<small>{{subtitle}}</small></h3>
    <p class="tagline">{{tagline}}</p>
    <p class="facts"><span>{{versionText}}</span><span>{{requirements}}</span></p>
    <div class="cta">
      <a class="btn" href="{{href}}#download">{{downloadApp}}</a>
      <a class="more" href="{{href}}">{{readMore}}</a>
    </div>
  </div>
  <div class="shots">
    <img src="{{root}}{{screenshot}}" width="1280" height="800" alt="{{screenshotAlt}}" fetchpriority="high">
    {{overlayImg}}
  </div>
</article>
