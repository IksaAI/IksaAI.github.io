<article class="tile feature" aria-labelledby="feature-title">
  <div class="feature-copy">
    <p class="label">No. {{no}}・主打作品</p>
    <img class="icon" src="{{icon}}" width="68" height="68" alt="">
    <h3 id="feature-title">{{name}}<small>{{subtitle}}</small></h3>
    <p class="tagline">{{tagline}}</p>
    <p class="facts"><span>版本 {{version}}</span><span>{{requirements}}</span><span>{{dmgSize}}</span></p>
    <div class="cta">
      <a class="btn" href="{{dmgUrl}}">下載 {{name}}</a>
      <a class="more" href="{{slug}}/">閱讀介紹 →</a>
    </div>
  </div>
  <div class="shots">
    <img src="{{screenshot}}" width="1280" height="800" alt="{{screenshotAlt}}" fetchpriority="high">
    {{overlayImg}}
  </div>
</article>
